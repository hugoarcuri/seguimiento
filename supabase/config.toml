# Supabase CLI configuration. Generated for the "seguimiento" project.
# Reference: https://supabase.com/docs/guides/cli/config
project_id = "seguimiento"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[functions.create-discipulador]
verify_jwt = true

[functions.registro-discipulo]
verify_jwt = false
